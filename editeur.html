<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Éditeur – Liste de Noël</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#fff7ef;--bg2:#eaf6ee;--card:#fff;--ink:#2a1d1d;--mute:#6f6262;--red:#c8102e;--dred:#a50d26;--green:#1b7f4b;--gold:#e6a817;--line:#f0dfd2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0a1f17;--bg2:#10281c;--card:#143325;--ink:#f6efe6;--mute:#b5c4ba;--red:#ef4b5f;--dred:#ff7a89;--green:#5fd699;--gold:#ffd166;--line:#245039}}
:root[data-theme="dark"]{--bg1:#0a1f17;--bg2:#10281c;--card:#143325;--ink:#f6efe6;--mute:#b5c4ba;--red:#ef4b5f;--dred:#ff7a89;--green:#5fd699;--gold:#ffd166;--line:#245039}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{position:relative;margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font:16px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.lights{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-around;pointer-events:none;overflow:hidden;z-index:2}
.lights::before{content:"";position:absolute;left:-3%;right:-3%;top:-18px;height:34px;border-bottom:2px solid #3b3b3b;border-radius:50%}
.lights i{position:relative;top:12px;width:12px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--c);box-shadow:0 0 12px 3px var(--c);animation:tw 1.6s ease-in-out infinite;animation-delay:var(--d)}
.lights i:nth-child(even){top:18px}
.lights i::before{content:"";position:absolute;left:3px;top:-5px;width:6px;height:6px;background:#444;border-radius:2px}
@keyframes tw{0%,100%{opacity:1;filter:brightness(1.2)}50%{opacity:.3;filter:brightness(.7)}}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:68px 16px 24px}
header{text-align:center;padding:8px 0 4px;display:grid;gap:8px}
h1{margin:0;font-family:"Mountains of Christmas",Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(38px,9vw,66px);line-height:1.1;color:var(--red);overflow-wrap:anywhere}
@supports (background-clip:text) or (-webkit-background-clip:text){h1{background:linear-gradient(90deg,var(--red),var(--gold),var(--green),var(--gold),var(--red));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite}}
@keyframes shine{to{background-position:300% 0}}
.sub{margin:0;color:var(--mute);font-size:19px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.note-top{margin:0;color:var(--dred);font-weight:700;font-size:14px}
.filt{text-align:center;margin:28px 0 14px;font-weight:700;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
.pill{background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:99px;padding:10px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.1);transition:transform .2s,box-shadow .2s}
.pill:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 8px 18px rgba(0,0,0,.15)}
.pill.on{background:linear-gradient(135deg,var(--green),#0f5c35);color:#fff;box-shadow:0 0 0 3px rgba(230,168,23,.55),0 6px 16px rgba(27,127,75,.45)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{position:relative;overflow:hidden;background:var(--card);border-radius:16px;padding:26px 18px 18px;box-shadow:0 4px 14px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:4px;transition:transform .25s,box-shadow .25s;animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:repeating-linear-gradient(135deg,var(--red) 0 10px,#fff 10px 20px)}
.card:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 14px 28px rgba(200,16,46,.22)}
.card:hover .price{animation:pop .5s}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}}
@keyframes pop{50%{transform:scale(1.18)}}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--mute);text-transform:uppercase}
.price{font-size:23px;font-weight:800;color:var(--green);display:inline-block}
.name{font-size:19px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.desc{color:var(--mute);overflow-wrap:anywhere}
.meta{color:var(--dred);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.sp{flex:1;min-height:12px}
.acts{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:8px}
a.btn,button.btn{position:relative;overflow:hidden;display:block;text-align:center;width:100%;font:inherit;font-weight:800;font-size:15px;cursor:pointer;border:0;border-radius:12px;padding:12px;background:linear-gradient(135deg,var(--red),var(--dred));color:#fff;text-decoration:none;box-shadow:0 4px 12px rgba(200,16,46,.35);transition:transform .15s}
a.btn:hover,button.btn:hover{transform:scale(1.03)}
a.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sweep 3.4s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-60%}100%{left:140%}}
button.btn[disabled]{background:var(--line);color:var(--mute);cursor:default;box-shadow:none;transform:none}
button.sm{font:inherit;font-size:14px;cursor:pointer;border-radius:10px;padding:8px 12px;background:transparent;color:var(--ink);border:1px solid var(--line)}
button.green{background:linear-gradient(135deg,var(--green),#0f5c35);color:#fff;border:0;font-weight:800}
.row{display:flex;gap:8px}.row>*{flex:1}
.prog{font-size:13px;color:var(--mute);text-align:center}
form{background:var(--card);border:2px dashed var(--green);border-radius:16px;padding:16px;margin:0 auto 24px;display:grid;gap:10px;max-width:640px}
form h2{margin:0;font-size:17px;color:var(--green)}
label{font-size:13px;color:var(--mute);display:grid;gap:4px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mute);padding:28px 0;grid-column:1/-1}
.bar{position:sticky;bottom:0;padding:12px 0;display:flex;justify-content:center;z-index:3}
.bar button.btn{width:auto;padding:12px 24px}
.hint{font-size:13px;color:var(--mute);text-align:center;margin:4px 0}
footer{position:relative;z-index:1;text-align:center;padding:8px 16px 40px;font:700 26px "Mountains of Christmas",Georgia,serif;color:var(--red);animation:float 3.5s ease-in-out infinite}
@media (max-width:520px){.two,.three{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="lights" id="lights" aria-hidden="true"></div>
<canvas id="snow" aria-hidden="true"></canvas>
<main id="app"></main>
<footer>🎅 Joyeux Noël ! ⛄</footer>
<script id="data" type="application/json">{"title":"🎁 Liste de Noël 2026","subtitle":"Les souhaits pour un Noël magique","note":"Prix indicatifs et liens d'achat cliquables.","items":[
{"id":"g1","name":"Petite Sunny Bouquet (10347)","desc":"LEGO Icons (Fleurs)","cat":"🧱 Sets LEGO","price":"29,99 €","qty":1,"info":"","url":""},
{"id":"g2","name":"High-Speed Train (40518)","desc":"LEGO Creator (Train)","cat":"🧱 Sets LEGO","price":"19,99 €","qty":2,"offered":0,"info":"","url":""},
{"id":"g3","name":"Adults Sweatshirt - Black","desc":"Vêtement LEGO (5009098)","cat":"👕 Mode & Chaussures","price":"49,99 €","qty":1,"info":"Taille : L ou M","url":""},
{"id":"g4","name":"Large Winking Girl Ceramic Mug","desc":"Tasse Céramique LEGO","cat":"🎮 Geek & Toy Story","price":"24,99 €","qty":1,"info":"","url":""},
{"id":"g5","name":"Bonnet Hilfiger Flag Cachemire","desc":"Tommy Hilfiger","cat":"👕 Mode & Chaussures","price":"39,90 €","qty":1,"info":"","url":""},
{"id":"g6","name":"T-shirt manche longue Levi's x Toy Story","desc":"Levi's x Toy Story","cat":"👕 Mode & Chaussures","price":"45,00 €","qty":1,"info":"Taille : L ou M","url":""}
]}</script>
<script>
(function(){
var state=JSON.parse(document.getElementById('data').textContent);
var app=document.getElementById('app');
var canEdit=true,editIdx=-1,msg='',cat='',out='';
if(canEdit){try{var d=localStorage.getItem('liste-noel-draft');if(d)state=JSON.parse(d);}catch(e){}}
function persist(){try{localStorage.setItem('liste-noel-draft',JSON.stringify(state));}catch(e){}}
function h(tag,props,kids){var e=document.createElement(tag);
  for(var k in (props||{})){if(k==='text')e.textContent=props[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),props[k]);else e.setAttribute(k,props[k]);}
  (kids||[]).forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
function safeUrl(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{var x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:'';}catch(e){return '';}}
function field(l,i){return h('label',{},[l,i]);}
function newId(){return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function cats(){var s=[];state.items.forEach(function(i){if(i.cat&&s.indexOf(i.cat)<0)s.push(i.cat);});return s;}
function label(c){return (c||'').replace(/^[^\p{L}\p{N}]+/u,'').trim();}
function exportJson(){var o=JSON.parse(JSON.stringify(state));var it=o.items;delete o.items;
  return (JSON.stringify(o).slice(0,-1)+',"items":[\n'+it.map(function(i){return JSON.stringify(i);}).join(',\n')+'\n]}').replace(/</g,'\\u003c');}


var GH={user:'',repo:'',token:''};
try{GH=Object.assign(GH,JSON.parse(localStorage.getItem('liste-noel-gh')||'{}'));}catch(e){}
function saveGH(){try{localStorage.setItem('liste-noel-gh',JSON.stringify(GH));}catch(e){}}
async function publish(){
  if(!GH.user||!GH.repo||!GH.token){msg='Renseigne d\'abord ta connexion GitHub (en bas de page).';render();return;}
  msg='Publication en cours…';render();
  var url='https://api.github.com/repos/'+encodeURIComponent(GH.user.trim())+'/'+encodeURIComponent(GH.repo.trim())+'/contents/index.html';
  var hd={'Authorization':'Bearer '+GH.token.trim(),'Accept':'application/vnd.github+json'};
  try{
    var r=await fetch(url,{headers:hd});
    if(r.status===401||r.status===403)throw new Error('Jeton refusé : vérifie le jeton et son droit « Contents : Read and write ».');
    if(r.status===404)throw new Error('index.html introuvable : vérifie le pseudo, le nom du dépôt, et que index.html est bien à la racine.');
    if(!r.ok)throw new Error('Erreur GitHub ('+r.status+').');
    var j=await r.json();
    var html=decodeURIComponent(escape(atob(j.content.replace(/\s/g,''))));
    var re=/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/;
    if(!re.test(html))throw new Error('Bloc de données introuvable dans index.html.');
    var data=exportJson();
    html=html.replace(re,function(m,a,b){return a+data+b;});
    var r2=await fetch(url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hd),body:JSON.stringify({message:'Mise à jour de la liste de Noël',content:btoa(unescape(encodeURIComponent(html))),sha:j.sha})});
    if(!r2.ok)throw new Error('Échec de l\'envoi ('+r2.status+').');
    msg='✅ Publié ! Le site se met à jour d\'ici 1 à 2 minutes.';
  }catch(e){msg='❌ '+(e.message||'Erreur réseau.');}
  render();
}
function ghPanel(){
  function inp(label,key,type,ph){return field(label,h('input',{type:type,placeholder:ph,value:GH[key]||'',autocomplete:'off',oninput:function(e){GH[key]=e.target.value;saveGH();}}));}
  var props={style:'max-width:640px;margin:16px auto;background:var(--card);border-radius:12px;padding:12px 16px'};
  if(!GH.token)props.open='open';
  return h('details',props,[
    h('summary',{style:'cursor:pointer;font-weight:700',text:'⚙️ Connexion GitHub (publication automatique)'}),
    h('div',{style:'display:grid;gap:10px;margin-top:10px'},[
      inp('Ton pseudo GitHub','user','text','ex : marie-dupont'),
      inp('Nom du dépôt','repo','text','ex : liste-noel'),
      inp('Jeton d\'accès (token)','token','password','github_pat_…'),
      h('p',{class:'hint',text:'Le jeton reste uniquement dans ce navigateur, sur ton ordinateur : il n\'est envoyé qu\'à GitHub.'})
    ])
  ]);
}

function render(){
  app.innerHTML='';
  if(canEdit)app.appendChild(h('p',{class:'hint',text:'✏️ Éditeur privé (ne le mets jamais sur GitHub). Tes modifications sont gardées dans ce navigateur. Quand tu as fini, clique sur « 🚀 Publier sur le site » en bas de page.'}));
  var head=h('header',{},[]);
  if(canEdit){
    head.appendChild(field('Titre',h('input',{value:state.title,oninput:function(e){state.title=e.target.value;persist();}})));
    head.appendChild(field('Sous-titre',h('input',{value:state.subtitle,oninput:function(e){state.subtitle=e.target.value;persist();}})));
    head.appendChild(field('Petite note en rouge',h('input',{value:state.note||'',oninput:function(e){state.note=e.target.value;persist();}})));
  }else{
    head.appendChild(h('h1',{text:state.title}));
    head.appendChild(h('p',{class:'sub',text:state.subtitle}));
    if(state.note)head.appendChild(h('p',{class:'note-top',text:state.note}));
  }
  app.appendChild(head);
  if(canEdit)app.appendChild(h('div',{style:'margin-top:20px'},[formEl()]));

  var cs=cats();
  if(cs.length>1){
    app.appendChild(h('div',{class:'filt',text:'Filtrer par catégorie'}));
    var p=h('div',{class:'pills'},[]);
    [['','🎁 Tous les cadeaux']].concat(cs.map(function(c){return [c,c];})).forEach(function(x){
      p.appendChild(h('button',{class:'pill'+(cat===x[0]?' on':''),onclick:function(){cat=x[0];render();},text:x[1]}));
    });
    app.appendChild(p);
  }

  var grid=h('div',{class:'grid'},[]),shown=0;
  state.items.forEach(function(it,i){
    if(cat&&it.cat!==cat)return;
    shown++;
    var link=safeUrl(it.url),qn=it.qty||1,off=it.offered||0,full=off>=qn;
    var acts=h('div',{class:'acts'},[]);
    if(canEdit){
      if(link)acts.appendChild(h('a',{class:'btn',href:link,target:'_blank',rel:'noopener noreferrer',text:'Voir sur le site ↗'}));
      acts.appendChild(h('div',{class:'row'},[
        h('button',{class:'sm',onclick:function(){editIdx=i;render();window.scrollTo(0,0);},text:'✏️ Modifier'}),
        h('button',{class:'sm',onclick:function(){if(confirm('Supprimer « '+it.name+' » ?')){state.items.splice(i,1);persist();editIdx=-1;render();}},text:'🗑️ Supprimer'})
      ]));
    }else if(full){
      acts.appendChild(h('button',{class:'btn',disabled:'disabled',text:'Déjà offert 🎁'}));
    }else{
      if(link)acts.appendChild(h('a',{class:'btn',href:link,target:'_blank',rel:'noopener noreferrer',text:'Voir sur le site ↗'}));
      if(off>0)acts.appendChild(h('div',{class:'prog',text:off+'/'+qn+' déjà offert'}));
    }
    var kids=[
      h('div',{class:'top'},[h('span',{class:'tag',text:label(it.cat)}),h('span',{class:'price',text:it.price||''})]),
      h('div',{class:'name',text:it.name}),
      it.desc?h('div',{class:'desc',text:it.desc}):null,
      qn>1?h('div',{class:'meta',text:'Quantité : '+qn}):null,
      it.info?h('div',{class:'meta',text:it.info}):null,
      h('div',{class:'sp'})
    ];
    if(acts.childNodes.length)kids.push(acts);
    grid.appendChild(h('div',{class:'card',style:'--i:'+Math.min(shown,12)},kids));
  });
  if(!shown)grid.appendChild(h('div',{class:'empty',text:canEdit?'Aucun cadeau ici : ajoute-en un ci-dessus ✨':'La liste est vide pour l\'instant.'}));
  app.appendChild(grid);

  if(canEdit){
    var ta=h('textarea',{readonly:'readonly',rows:'8',style:'width:100%;margin-top:12px;font:12px monospace;display:'+(out?'block':'none')});ta.value=out;
    app.appendChild(h('div',{class:'bar'},[
      h('button',{class:'btn',style:'margin-right:8px',onclick:publish,text:'🚀 Publier sur le site'}),
      h('button',{class:'btn green',onclick:function(){out=exportJson();try{navigator.clipboard.writeText(out);msg='Copié ! Colle-le dans index.html à la place du bloc de données.';}catch(e){msg='Sélectionne et copie le texte ci-dessous.';}render();},text:'📋 Copier les données'}),
      h('button',{class:'sm',style:'margin-left:8px',onclick:function(){if(confirm('Effacer mes modifications locales et repartir du fichier ?')){try{localStorage.removeItem('liste-noel-draft');}catch(e){}location.reload();}},text:'↺ Repartir du fichier'})
    ]));
    app.appendChild(ta);app.appendChild(ghPanel());
    if(msg)app.appendChild(h('p',{class:'hint',text:msg}));
  }
}

function formEl(){
  var it=editIdx>=0?state.items[editIdx]:{name:'',desc:'',cat:'',price:'',qty:1,offered:0,info:'',url:''};
  var name=h('input',{placeholder:'Ex : Casque audio',required:'required',value:it.name});
  var desc=h('input',{placeholder:'Marque, modèle…',value:it.desc||''});
  var c=h('input',{placeholder:'Ex : 🧱 Sets LEGO',list:'cl',value:it.cat||''});
  var dl=h('datalist',{id:'cl'},cats().map(function(x){return h('option',{value:x});}));
  var price=h('input',{placeholder:'29,99 €',value:it.price||''});
  var qty=h('input',{type:'number',min:'1',max:'999',value:it.qty||1});
  var offered=h('input',{type:'number',min:'0',max:'999',value:it.offered||0});
  var info=h('input',{placeholder:'Taille : L ou M',value:it.info||''});
  var url=h('input',{placeholder:'https://…',inputmode:'url',value:it.url||''});
  var f=h('form',{},[
    h('h2',{text:editIdx>=0?'Modifier le cadeau':'Ajouter un cadeau'}),
    field('Nom du cadeau',name),field('Description',desc),
    h('div',{class:'two'},[field('Catégorie (emoji au début si tu veux)',c),field('Lien du site pour commander',url)]),
    h('div',{class:'two'},[field('Prix',price),field('Précision (taille…)',info)]),
    h('div',{class:'two'},[field('Quantité souhaitée',qty),field('Déjà offert (quantité)',offered)]),
    dl,
    h('div',{class:'row'},[h('button',{type:'submit',class:'sm green',text:editIdx>=0?'Mettre à jour':'Ajouter'}),editIdx>=0?h('button',{type:'button',class:'sm',onclick:function(){editIdx=-1;render();},text:'Annuler'}):null])
  ]);
  f.addEventListener('submit',function(ev){
    ev.preventDefault();var nm=name.value.trim();if(!nm)return;
    var obj={id:editIdx>=0?state.items[editIdx].id:newId(),name:nm,desc:desc.value.trim(),cat:c.value.trim(),price:price.value.trim(),qty:Math.max(1,parseInt(qty.value,10)||1),offered:Math.max(0,parseInt(offered.value,10)||0),info:info.value.trim(),url:safeUrl(url.value)};
    if(editIdx>=0)state.items[editIdx]=obj;else state.items.push(obj);
    editIdx=-1;persist();render();
  });
  return f;
}
render();
})();
</script>
<script>
(function(){
var L=document.getElementById('lights'),cols=['#ff3b4e','#ffc83d','#3ddc84','#4cc3ff'],n=Math.max(8,Math.floor(innerWidth/46));
for(var i=0;i<n;i++){var b=document.createElement('i');b.style.setProperty('--c',cols[i%4]);b.style.setProperty('--d',((i*0.37)%1.6).toFixed(2)+'s');L.appendChild(b);}
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
var cv=document.getElementById('snow'),cx=cv.getContext('2d'),W=0,H=0,fl=[];
var dark=matchMedia('(prefers-color-scheme: dark)').matches;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
size();addEventListener('resize',size);
var N=innerWidth<600?40:90;
for(i=0;i<N;i++)fl.push({x:Math.random()*W,y:Math.random()*H,r:1.2+Math.random()*3,v:.4+Math.random()*1.1,p:Math.random()*6.28,s:.3+Math.random()*.7});
function loop(t){
  if(!document.hidden){
    cx.clearRect(0,0,W,H);
    cx.fillStyle=dark?'rgba(255,255,255,.9)':'rgba(176,208,240,.95)';
    cx.strokeStyle=dark?'rgba(255,255,255,0)':'rgba(110,150,200,.55)';
    for(var k=0;k<fl.length;k++){var f=fl[k];
      f.y+=f.v;f.x+=Math.sin(t/1000*f.s+f.p)*.6;
      if(f.y>H+5){f.y=-5;f.x=Math.random()*W;}
      cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill();cx.stroke();}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
